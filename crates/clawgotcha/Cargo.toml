[package]
name = "clawgotcha"
version = "0.1.0"
edition = "2021"
description = "Clawgotcha control-plane client and sync orchestration for Miroclaw / ZeroClaw"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing = { version = "0.1", default-features = false }
urlencoding = "2.1"

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6"
